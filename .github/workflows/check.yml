name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sprite library (palette, metadata, license)
        run: python tools/validate_sprites.py
      - name: Setup check plan (the test of the tool)
        run: |
          python pixsci.py check skills/setup/smoke/explainer.yaml
          python pixsci.py board skills/setup/smoke/explainer.yaml "$RUNNER_TEMP/ci" -f landscape,vertical,square,banner
