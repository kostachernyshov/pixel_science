name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sprite library (palette, metadata, license)
        run: python tools/validate_sprites.py
      - name: Setup check plan (the test of the tool)
        run: |
          python pixsci.py check skills/setup/smoke/explainer.yaml
          python pixsci.py board skills/setup/smoke/explainer.yaml "$RUNNER_TEMP/ci" -f landscape,vertical,square,banner
      - name: Linter (unused imports, undefined names)
        run: pip install ruff && ruff check --select F --ignore F403,F405 pixel_kit pixsci.py tools
      - name: No module calls another module's private name
        run: |
          if grep -noE "\b[A-Za-z_][A-Za-z0-9_]*\._[A-Za-z][A-Za-z0-9_]*" pixel_kit/*.py pixsci.py tools/*.py | grep -vE ":(self|cls)\._"; then
            echo "use a public name of the module (CONTRIBUTING.md, Work on the core)"; exit 1
          fi
