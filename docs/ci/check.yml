# Move this file to .github/workflows/check.yml (the agent's token could not write workflows).
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sprites of every pack (palette, metadata, tags, credits, license)
        run: python tools/validate_sprites.py
      - name: Catalog is fresh
        run: python pixsci.py catalog --check
      - name: Example plans (rules, pace, motion)
        run: |
          for p in examples/*/explainer.yaml; do python pixsci.py check "$p"; done
      - name: Storyboards in all formats and styles (no ffmpeg needed)
        run: |
          for p in examples/*/explainer.yaml; do python pixsci.py board "$p" out/$(basename $(dirname "$p")) --html; done
      - uses: actions/upload-artifact@v4
        with:
          name: storyboards
          path: out/
