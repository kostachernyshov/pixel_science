# Biology verbs. Format and rules: pixel_kit/verbs.yaml and .agents/skills/add-verb/SKILL.md.
# Only motion that exists in the body: no fire, ice, magic, or explosions.

colors:
  granule: [PLUM, XCRIMSON, RED, PINK]     # granzymes, perforin
  pdl1: [XPLUM, PLUM, XPURPLE, LAV]        # the PD-L1 shield of a tumor cell
  membrane: [BROWN, XORANGE, ORANGE, PEACH]
  cytoplasm: [XMAUVE, LAV, PINK, PEACH]
  antibody: [XNAVY, XBLUE, BLUE, XLEMON]
  tracer: [BROWN, XRUST, XORANGE, ORANGE]     # a tracer (carbon-14 in the Simard experiment); a beat's color: changes it
  tracer2: [XNAVY, NAVY, XBLUE, BLUE]         # a second tracer (carbon-13)
  shadow: [BLACK, XNAVY, NAVY, NAVY]          # less light

verbs:
  secrete:
    desc: The actor releases granules (granzymes, perforin) at the target; they hit it.
    relation: transfer
    target: true
    hit: {at: 0.22, preset: soft}
    steps:
      - {prim: jet, from: actor, to: target, color: granule, dur: 0.6, n: 4, arc: 4}
      - {prim: sparks, at: target, color: granule, t: 0.22, dur: 0.6, n: 6}

  block:
    desc: The actor raises a PD-L1 shield; the target's blow glances off it.
    target: true
    hit: {at: 0.5, preset: soft, by: target}
    steps:
      - {prim: shell, at: actor, color: pdl1, dur: 1.8, flash: 0.5}
      - {prim: burst, at: actor, color: pdl1, t: 0.5, dur: 0.5, n: 8, speed: 60, edge: target}

  apoptosis:
    desc: The actor dies quietly; it breaks up into small pieces from the edge (not an explosion).
    relation: destroy
    hide: actor
    steps:
      - {prim: dissolve, at: actor, color: membrane, dur: 1.2}
      - {prim: burst, at: actor, color: cytoplasm, t: 0.2, dur: 1.0, n: 8, speed: 25}

  bind:
    desc: Two parts touch and hold, or an agent (an antibody) sits on a part; a small wave and a glow where they touch.
    relation: [bind, occupy]
    target: true
    steps:
      - {prim: ring, at: target, color: antibody, dur: 0.5, size: 10}
      - {prim: glow, at: target, color: antibody, dur: 0.8, size: 1.2}
      - {prim: sparks, at: target, color: antibody, dur: 0.6, n: 4}

  flow:
    desc: Matter moves from the actor to the target along a path (carbon through roots and fungus, sap); dots run to the target and gather there.
    relation: transfer
    target: true
    steps:
      - {prim: jet, from: actor, to: target, color: tracer, dur: 2.4, n: 6, arc: 0, width: 1}
      - {prim: sparks, at: target, color: tracer, t: 1.3, dur: 1.1, n: 5}
      - {prim: glow, at: target, color: tracer, t: 1.5, dur: 0.9, size: 1.0}

  absorb:
    desc: The actor (a gas, a nutrient) is taken up by the target; dots run into it, the actor fades, the target glows.
    relation: transfer
    target: true
    hide: actor
    steps:
      - {prim: trail, from: actor, to: target, color: tracer, dur: 1.4, gap: 3, speed: 24}
      - {prim: dissolve, at: actor, color: tracer, t: 0.3, dur: 1.0}
      - {prim: glow, at: target, color: tracer, t: 0.7, dur: 0.8, size: 0.8}

  inject:
    desc: The actor (a syringe) puts the target in place (a gas puff, a dose); a short stream, then the target appears.
    target: true
    show: target
    steps:
      - {prim: jet, from: actor, to: target, color: tracer, dur: 0.5, n: 3, arc: 0}
      - {prim: sparks, at: target, color: tracer, t: 0.2, dur: 0.6, n: 4}

  shade:
    desc: The actor (a shade cloth, a canopy) takes light from the target; a dark tint settles on it.
    relation: change
    target: true
    steps:
      - {prim: ring, at: target, color: shadow, dur: 0.8, size: 10, flat: 0.5}
      - {prim: glow, at: target, color: shadow, dur: 1.6, size: 0.9}

  question:
    desc: '"?" over the actor: is it so? (a guess to test)'
    steps:
      - {prim: sign, at: actor, color: sign, dur: 1.6, text: "?"}

  seep:
    desc: A little matter leaks from the actor to the target (through soil, not a channel); sparse faint dots, a weak glow.
    relation: transfer
    target: true
    steps:
      - {prim: trail, from: actor, to: target, color: tracer, dur: 2.0, gap: 9, speed: 20}
      - {prim: glow, at: target, color: tracer, t: 1.4, dur: 0.6, size: 0.6}
