title: "Anti-PD-L1: releasing the brakes"
name: anti-pdl1
lang: en
packs: [biology]
style: paper
voiceover: voiceover.md
formats: [landscape, vertical, square, banner]
seed: 7
# The mechanism, from the sources: who takes part, and every link with its source (number in sources).
# Contact scenes draw only these links; pixsci check enforces contact, persistence, and causality.
model:
  things:
    t:     {sprite: killer_t, label: "KILLER T CELL",
            parts: {tcr: {label: "TCR", color: GREEN}, pd1: {label: "PD-1", color: LGREY}}}
    tumor: {sprite: tumor_pdl1, label: "TUMOR CELL",
            parts: {mhc1: {label: "MHC-I", color: YELLOW}, pdl1: {label: "PD-L1", color: PINK}}}
    drug:  {label: "ANTI-PD-L1", color: BLUE}
  links:
    signal: {kind: bind,   a: tcr,  b: mhc1,  source: 1}
    brake:  {kind: bind,   a: pd1,  b: pdl1,  source: 1}
    block:  {kind: occupy, a: drug, b: pdl1,  source: 4}
    kill:   {kind: kill,   a: t,    b: tumor, source: 3}

sources:
  - "Pardoll DM. The blockade of immune checkpoints in cancer immunotherapy. Nat Rev Cancer 2012;12:252-264. doi:10.1038/nrc3239"
  - "Dong H, Strome SE, Salomao DR, et al. Tumor-associated B7-H1 promotes T-cell apoptosis: a potential mechanism of immune evasion. Nat Med 2002;8:793-800. doi:10.1038/nm730"
  - "Iwai Y, Ishida M, Tanaka Y, et al. Involvement of PD-L1 on tumor cells in the escape from host immune system and tumor immunotherapy by PD-L1 blockade. PNAS 2002;99:12293-12297. doi:10.1073/pnas.192461099"
  - "Herbst RS, Soria JC, Kowanetz M, et al. Predictive correlates of response to the anti-PD-L1 antibody MPDL3280A in cancer patients. Nature 2014;515:563-567. doi:10.1038/nature14011"

scenes:
  - id: S01
    type: title
    title: "ANTI-PD-L1"
    sub: "Releasing the brakes"

  - id: S02
    type: action
    scale: 3
    bg: tme
    actors:
      t:     {sprite: killer_t, at: [0.1, 0.55], anim: move}
      tumor: {sprite: tumor_pdl1, at: [0.7, 0.55]}
    beats:
      - {t: 0.2, actor: t, move_to: [0.42, 0.55], dur: 1.6}
      - {on: cancer, actor: tumor, fx: sparkle}
      - {on: cancer, actor: t, anim: idle, offset: 0.4}
    caption: "Contact"

  - id: S03
    type: contact
    bg: tme
    left: t
    right: tumor
    show: [brake, signal]
    beats:
      - {on: receptor, cell: left, fx: sparkle}
      - {on: tcr, do: signal}
      - {on: grabs, cell: right, fx: sparkle}
      - {on: cancer, cell: left, fx: sparkle}
      - {on: t, cell: left, anim: blink}
      - {on: ready, cell: left, anim: alert}
      - {on: ready, cell: left, fx: alert}
    camera:
      - {t: 0, zoom: 1}
      - {on: mhc-i, zoom: 2, at: gap}
      - {on: ready, zoom: 1}
    caption: "Signal: attack"

  - id: S04
    type: contact
    bg: tme
    left: t
    right: tumor
    show: [brake, signal]
    beats:
      - {t: 0, cell: left, anim: alert}
      - {on: but, cell: right, fx: sparkle}
      - {on: also, cell: left, fx: sparkle}
      - {on: carries, cell: right, fx: sparkle}
      - {on: binds, do: brake}
      - {on: "pd-1", cell: left, fx: hit}
      - {on: t, cell: left, fx: sparkle}
      - {on: stops, cell: left, anim: blocked}
      - {on: stops, cell: left, fx: zzz}
    camera:
      - {t: 0, zoom: 2, at: gap}
      - {on: binds, zoom: 1}
      - {on: stops, zoom: 2, at: left}
    caption: "Brake on"

  - id: S05
    type: contact
    bg: tme
    left: t
    right: tumor
    show: [brake, signal]
    beats:
      - {t: 0, cell: left, anim: blocked}
      - {t: 0, cell: left, fx: zzz}
      - {on: drug, cell: right, fx: sparkle}
      - {on: antibody, cell: right, fx: sparkle}
      - {on: sticks, do: block}
      - {on: cannot, cell: left, fx: sparkle}
      - {on: hold, cell: left, anim: idle}
    camera:
      - {t: 0, zoom: 1}
      - {on: sticks, zoom: 2, at: gap, offset: 0.6}
    caption: "Anti-PD-L1"

  - id: S06
    type: contact
    bg: tme
    left: t
    right: tumor
    show: [brake, signal]
    beats:
      - {t: 0, cell: left, anim: blocked}
      - {on: nothing, cell: left, fx: sparkle}
      - {on: off, cell: left, anim: alert}
      - {on: off, cell: left, fx: alert}
      - {on: off, cell: left, fx: sparkle, offset: 0.9}
      - {on: attacks, cell: left, anim: attack}
      - {on: attacks, cell: right, anim: hit, offset: 0.3}
      - {on: attacks, cell: right, fx: hit, offset: 0.3}
    camera:
      - {t: 0, zoom: 2, at: left}
      - {on: brake, zoom: 1}
      - {on: attacks, shake: 0.4, amp: 3, offset: 0.3}
    caption: "Brake off"

  - id: S07
    type: contact
    bg: tme
    left: t
    right: tumor
    show: [brake, signal]
    beats:
      - {t: 0, cell: left, anim: alert}
      - {on: dies, do: kill}
      - {on: shrinks, cell: left, fx: sparkle}
      - {on: breaks, cell: right, fx: particles}
      - {on: up, cell: left, fx: sparkle}
    camera:
      - {t: 0, zoom: 1}
      - {on: shrinks, zoom: 2, at: gap}
    caption: "Apoptosis"

  - id: S08
    type: summary
    title: "HOW ANTI-PD-L1 WORKS"
    items:
      - {sprite: tumor_pdl1, label: "PD-L1 blocked", color: unfavorable}
      - {sprite: killer_t, label: "T cell free", color: favorable}
    text: ["Block the brake,", "the T cell kills"]
