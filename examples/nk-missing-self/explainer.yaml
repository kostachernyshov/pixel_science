title: "How NK cells find cancer"
name: nk-missing-self
lang: en
voiceover: voiceover.md
formats: [landscape, vertical, square, banner]
sources:
  - "Karre K, Ljunggren HG, Piontek G, Kiessling R. Selective rejection of H-2-deficient lymphoma variants suggests alternative immune defence strategy. Nature 1986;319:675-678. doi:10.1038/319675a0"
  - "Ljunggren HG, Karre K. In search of the 'missing self': MHC molecules and NK cell recognition. Immunol Today 1990;11:237-244. doi:10.1016/0167-5699(90)90097-S"
  - "Vivier E, Tomasello E, Baratin M, Walzer T, Ugolini S. Functions of natural killer cells. Nat Immunol 2008;9:503-510. doi:10.1038/ni1582"

scenes:
  - id: S01
    type: title
    title: "MISSING SELF"
    sub: "How NK cells find cancer cells"

  - id: S02
    type: cast
    title: "THE CAST"
    items:
      - {sprite: nk, label: NK cell, color: favorable}
      - {sprite: epithelial, label: Healthy cell, color: neutral}
      - {sprite: tumor_no_mhc, label: Cancer cell, color: unfavorable}
    caption: "The patrol"

  - id: S03
    type: action
    bg: tissue
    actors:
      nk: {sprite: nk, at: [0.15, 0.5], anim: move}
      cell: {sprite: epithelial, at: [0.72, 0.5], badge: badge_mhc_self}
    beats:
      - {t: 0.3, actor: nk, move_to: [0.45, 0.5], dur: 1.6}
      - {t: 1.9, actor: nk, anim: alert}
      - {t: 2.6, actor: nk, anim: blocked}
      - {t: 2.6, actor: cell, fx: sparkle}
      - {t: 4.0, actor: nk, anim: move, flip: true}
      - {t: 4.0, actor: nk, move_to: [0.12, 0.5], dur: 1.6}
    caption: "Badge: spared"

  - id: S04
    type: action
    bg: tissue
    actors:
      tcell: {sprite: killer_t, at: [0.15, 0.5], anim: move}
      tumor: {sprite: tumor, at: [0.72, 0.5]}
    beats:
      - {t: 0.4, actor: tumor, anim: lose_mhc}
      - {t: 1.2, actor: tcell, move_to: [0.85, 0.5], dur: 2.2}
    caption: "No badge"

  - id: S05
    type: action
    bg: tissue
    actors:
      nk: {sprite: nk, at: [0.12, 0.5], anim: move}
      tumor: {sprite: tumor_no_mhc, at: [0.7, 0.5]}
    beats:
      - {t: 0.3, actor: nk, move_to: [0.45, 0.5], dur: 1.2}
      - {t: 1.5, actor: nk, anim: alert}
      - {t: 1.5, actor: nk, fx: alert}
      - {t: 2.2, actor: nk, anim: attack}
      - {t: 2.6, actor: tumor, anim: hit}
      - {t: 2.6, actor: tumor, fx: hit}
      - {t: 3.0, actor: tumor, anim: death}
      - {t: 3.6, actor: nk, anim: idle}
    caption: "Missing: kill"

  - id: S06
    type: summary
    title: "THE MISSING SELF RULE"
    items:
      - {sprite: epithelial, label: "Badge: spare", color: favorable}
      - {sprite: tumor_no_mhc, label: "No badge: kill", color: unfavorable}
    text: ["NK cells kill cells", "that hide their ID"]
