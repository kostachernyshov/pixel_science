# The setup check: a short video that uses each part of the tool once. Not a science video.
# It is also the test of the tool: CI runs check and board on it, so each case below must keep working.
title: "Setup check"
name: setup-check
lang: en
packs: [biology]
voiceover: voiceover.md
formats: [landscape]
sources:
  - "Setup check of pixel_science: no claims."
timeline: {from: 1980, to: 2000, unit: year, now: 1998}     # a strip under the stage (hidden in title and summary)
model:
  things:
    t:    {parts: {tcr: {label: TCR, color: GREEN}}}
    cell: {parts: {mhc1: {label: MHC-I, color: YELLOW}, rec: {label: Receptor, color: GREEN}}}
    ligand: {parts: {key: {label: Ligand, color: ORANGE}}}
  relations:
    signal: {kind: bind, a: tcr, b: mhc1, source: "1: setup check"}
    drawn:  {kind: change, a: t, b: cell, after: signal, source: "1: setup check"}
    dock:   {kind: bind, a: key, b: rec,  source: "1: setup check"}
    dies:   {kind: destroy, a: t, b: cell, source: "1: setup check"}
scenes:
  - id: S01
    type: title
    title: "PIXEL SCIENCE"
    sub: "setup check"
  - id: S02
    type: action
    title: "It works"
    actors:
      syringe: {sprite: syringe, at: [0.15, 0.4]}
      mouse:   {sprite: mouse_top, at: [0.7, 0.5]}
    beats:
      - {t: 0.2, actor: syringe, move_to: mouse, dur: 1.2}       # stops at the mouse's edge
      - {word: "in", actor: syringe, verb: hit, target: mouse}     # "in", not "into": the same word wins
  - id: S03
    type: action
    title: "It binds"
    actors:
      t:    {sprite: killer_t, at: [0.2, 0.5], anim: move, parts: [tcr]}
      cell: {sprite: tumor, at: [0.75, 0.5], label: Cancer, parts: [mhc1]}
    beats:
      - {word: "T", actor: t, move_to: cell, dur: 1.2}            # "T", not "The"; stops at the gap of the bind
      - {word: "binds", actor: tcr, verb: bind, target: mhc1}
  - id: S04
    type: action
    title: "It docks"
    actors:
      ligand: {sprite: protein_folded, at: [0.15, 0.5], parts: [key]}  # "body": "molecule": no stalk
      cell:   {sprite: tumor, at: [0.75, 0.5], label: Cancer, parts: [rec]}
    beats:
      - {word: "ligand", actor: ligand, move_to: cell, dur: 1.2}  # its edge stops at the receptor's head
      - {word: "docks", actor: key, verb: bind, target: rec}
  - id: S05
    type: custom
    title: "By hand"
    module: scene.py
    why: "the setup check: a custom scene must still pass check"
    beats:
      - {word: "hand", shows: drawn}                               # times the code and shows the relation
  - id: S06
    type: action
    title: "Two panels"
    set: {type: panels, panels: [{title: LEFT, counter: "0 OF 1"}, {title: RIGHT, counter: "0 OF 1"}]}  # a set
    actors:
      nk:  {sprite: nk, in: all, at: [0.25, 0.5]}                 # the same actor in each panel
      one: {sprite: tumor, in: B, at: [0.7, 0.5]}                 # at: a fraction of its zone
  - id: S07
    type: action
    continue: true                                                # the set and the actors go on, no dissolve
    beats:
      - {word: "goes", actor: one, verb: vanish}
      - {word: "counts", panel: B, counter: "1 OF 1"}             # a counter changes on its word
  - id: S08
    type: action
    title: "In and out"
    set: {type: border, at: 0.5, top: OUTSIDE, bottom: INSIDE, line: membrane}   # the line comes from the pack
    actors:
      rec: {sprite: membrane_receptor, in: border, at: [0.6, 0]}  # stands on the line
      out: {sprite: nk, in: top, at: [0.2, 0.5]}
      in:  {sprite: proteasome, in: bottom, at: [0.3, 0.5]}
    beats:
      - {word: "border", timeline: 1982}                       # the cursor rewinds: a long jump shows its span
      - {word: "part", mark: 1982, label: START}               # a mark stays on the strip
      - {word: "part", mark: 1983, label: NEXT, color: favorable}  # a close mark: its label stands beside the first
  - id: S09
    type: action
    title: "Ghosts"
    actors:
      one: {sprite: patient_a, at: [0.3, 0.5], marks: [{at: [0.5, 0.75], color: unfavorable}]}  # a dot on the body
      two: {sprite: patient_b, at: [0.7, 0.5], hidden: true}
    beats:
      - {word: "plaster", actor: one, marks: [{at: [0.5, 0.75], sprite: plaster}]}   # the marks from this word
      - {word: "fades", actor: one, ghost: true}                   # any sprite has a ghost; it stays
      - {word: "other", actor: two, ghost: true}                   # a hidden actor appears as a ghost
      - {word: "then", actor: two, move_to: one, dur: 0.8}          # the scene ends in contact
      - {word: "back", actor: two, ghost: false}                   # and comes back
  - id: S10
    type: action
    continue: true                                                # the ghost and the marks go on
    beats:
      - {t: 0.1, actor: two, wander: true}                        # goes on from the contact place, in each format
      - {word: "stays", actor: two, flip: true}
  - id: S11
    type: action
    title: "Life"
    actors:
      nk:  {sprite: nk, at: [0.12, 0.3], anim: move}
      c1:  {sprite: tumor, thing: cell, at: [0.45, 0.25], still: true}   # still: no motion at rest
      c2:  {sprite: tumor, thing: cell, at: [0.75, 0.3]}
      c3:  {sprite: tumor, at: [0.7, 0.75], marks: [{at: [0.5, 0.5], color: favorable}]}
      c4:  {sprite: tumor, hidden: true}                         # the daughter of c3: divide: places it
      t:   {sprite: killer_t, at: [0.2, 0.75]}
    beats:
      - {word: "hunts", actor: nk, hunt: [c1, c2], verb: hit, then: apoptosis, ghost: true}   # each in turn; the model sees who dies
      - {word: "walks", actor: t, wander: true}                  # in its zone, until its next beat
      - {word: "divides", actor: c3, divide: c4}                 # c4 appears beside it, with its marks
  - id: S12
    type: summary
    title: "Ready"
    text: "One plan, four formats."
